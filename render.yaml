# Render Blueprint 配置 —— Push 到 GitHub 后，Render 读取此文件一键建服务。
# 文档：https://render.com/docs/blueprint-spec
services:
  - type: web
    name: qq-blog
    env: python
    branch: main              # 你的主分支名（如为 master 请改此处）
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn -w 4 -b 0.0.0.0:$PORT app:app"
    envVars:
      - key: FLASK_ENV
        value: production     # 关闭 Debug，避免泄露调试信息
      - key: FLASK_SECRET_KEY
        generateValue: true   # Render 自动生成强随机密钥（Session 安全）
      - key: BLOG_DB
        value: /var/data/blog.db   # 数据库落在持久磁盘，重启不丢数据
    # 持久磁盘：SQLite 必须挂载持久卷，否则实例重启/休眠后 DB 被重置。
    disk:
      name: blog-data
      mountPath: /var/data
      sizeGB: 1
