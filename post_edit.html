{% extends "base.html" %}
{% block title %}编辑文章 · 简易博客{% endblock %}
{% block page_title %}编辑文章{% endblock %}
{% block content %}
<div class="card">
    <h2 style="margin-top:0;">编辑文章</h2>
    <form method="post" enctype="multipart/form-data">
        <label class="form-label" for="title">标题</label>
        <input id="title" name="title" type="text" value="{{ post.title }}" required>

        <label class="form-label" for="category">分类</label>
        <select id="category" name="category">
            {% for c in categories %}
            <option value="{{ c }}" {% if post.category==c %}selected{% endif %}>{{ c }}</option>
            {% endfor %}
        </select>

        <label class="form-label" for="tags">标签（逗号分隔，最多 8 个）</label>
        <input id="tags" name="tags" type="text" value="{{ post.tags|join(', ') if post.tags else '' }}">

        <label class="form-label" for="content">正文</label>
        <textarea id="content" name="content">{{ post.content }}</textarea>

        {% if post.media_path %}
        <label class="form-label">当前媒体</label>
        <div style="margin-bottom:8px;">
            {% if post.media_type == 'image' %}
            <img class="post-media" src="/uploads/{{ post.media_path }}" style="max-height:220px;">
            {% else %}
            <video class="post-media" src="/uploads/{{ post.media_path }}" controls style="max-height:220px;"></video>
            {% endif %}
        </div>
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-sub);margin-bottom:10px;">
            <input type="checkbox" name="remove_media" value="1"> 删除当前媒体
        </label>
        {% endif %}

        <label class="form-label" for="media">替换媒体（可选）</label>
        <input id="media" name="media" type="file" accept="image/*,video/*">

        <div style="display:flex;gap:10px;margin-top:18px;">
            <button class="btn btn-primary" type="submit">保存修改</button>
            <a class="btn btn-ghost" href="/post/{{ post.id }}">取消</a>
        </div>
    </form>
</div>
{% endblock %}
